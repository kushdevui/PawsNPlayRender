<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so the tab bar can sit above the iPhone home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>PawsNPlay</title>
    <!-- react-native-web style reset, sized to the *visible* screen on mobile browsers. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #ffffff;
      }
      /* Disable page scrolling - screens scroll inside their own ScrollView. */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /*
        100% / 100vh on mobile Safari and Chrome includes the area behind the browser's
        bottom toolbar, which hid the tab bar. 100dvh is the visible height; the fixed
        inset keeps the app pinned to the visible viewport on older browsers too.
      */
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex: 1;
        height: 100%;
        height: 100dvh;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
